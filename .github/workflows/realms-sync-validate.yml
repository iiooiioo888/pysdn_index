name: Realms Data Validate

on:
  push:
    branches: [main]
    paths:
      - "frontend_new/scripts/sync-three-realms.mjs"
      - "frontend_new/scripts/validate-three-realms.mjs"
      - "frontend_new/src/data/threeRealmsFeatures*.ts"
      - "frontend_new/content/note-realms/**"
      - "frontend_new/package.json"
      - ".github/workflows/realms-sync-validate.yml"
  pull_request:
    paths:
      - "frontend_new/scripts/sync-three-realms.mjs"
      - "frontend_new/scripts/validate-three-realms.mjs"
      - "frontend_new/src/data/threeRealmsFeatures*.ts"
      - "frontend_new/content/note-realms/**"
      - "frontend_new/package.json"
      - ".github/workflows/realms-sync-validate.yml"
  workflow_dispatch:

jobs:
  validate-realms-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend_new/package-lock.json

      - name: Install dependencies
        working-directory: frontend_new
        run: npm ci

      - name: Validate Three Realms data (committed artefacts)
        working-directory: frontend_new
        run: npm run validate:realms
