name: Realms Sync Validate

on:
  push:
    branches: [main]
    paths:
      - "frontend_new/scripts/sync-three-realms.mjs"
      - "frontend_new/scripts/validate-three-realms.mjs"
      - "frontend_new/src/data/threeRealmsFeatures*.ts"
      - "frontend_new/package.json"
      - ".github/workflows/realms-sync-validate.yml"
  pull_request:
    paths:
      - "frontend_new/scripts/sync-three-realms.mjs"
      - "frontend_new/scripts/validate-three-realms.mjs"
      - "frontend_new/src/data/threeRealmsFeatures*.ts"
      - "frontend_new/package.json"
      - ".github/workflows/realms-sync-validate.yml"
  workflow_dispatch:

jobs:
  sync-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend_new/package-lock.json

      - name: Install dependencies
        working-directory: frontend_new
        run: npm ci

      - name: Ensure NOTE_GITHUB_TOKEN is configured
        env:
          NOTE_GITHUB_TOKEN: ${{ secrets.NOTE_GITHUB_TOKEN }}
        run: |
          if [ -z "$NOTE_GITHUB_TOKEN" ]; then
            echo "Missing required secret: NOTE_GITHUB_TOKEN"
            exit 1
          fi

      - name: Sync realms data from Note (token required)
        working-directory: frontend_new
        env:
          NOTE_GITHUB_TOKEN: ${{ secrets.NOTE_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.NOTE_GITHUB_TOKEN }}
        run: npm run sync:realms

      - name: Validate generated realms data
        working-directory: frontend_new
        run: npm run validate:realms

      - name: Ensure generated data is committed
        run: git diff --exit-code -- frontend_new/src/data/threeRealmsFeatures.ts frontend_new/src/data/threeRealmsFeatures.tianyu.ts frontend_new/src/data/threeRealmsFeatures.shenyu.ts frontend_new/src/data/threeRealmsFeatures.jingjie.ts
