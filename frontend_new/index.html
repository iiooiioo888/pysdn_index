    <!--
      GitHub Pages SPA fallback：404.html 會把真實路徑塞進 ?/path；此腳本還原為 pathname + hash。
      若改為 Netlify／Cloudflare Pages 等原生 SPA 導向，可刪除此段並改用平台 rewrites。
    -->
    <script>
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
