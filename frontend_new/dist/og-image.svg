<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a1a"/>
      <stop offset=".5" stop-color="#111827"/>
      <stop offset="1" stop-color="#0a0a1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset=".5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect fill="url(#bg)" width="1200" height="630"/>
  <!-- Grid pattern -->
  <g opacity=".06" stroke="#fff" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="630"/><line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="200" y1="0" x2="200" y2="630"/><line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/><line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/><line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/><line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/><line x1="1100" y1="0" x2="1100" y2="630"/>
    <line x1="1200" y1="0" x2="1200" y2="630"/>
    <line x1="0" y1="0" x2="1200" y2="0"/><line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/><line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/><line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>
  <!-- Accent orb -->
  <circle cx="600" cy="300" r="180" fill="url(#accent)" opacity=".08"/>
  <circle cx="600" cy="300" r="100" fill="url(#accent)" opacity=".12"/>
  <!-- Lightning bolt -->
  <g transform="translate(570,180)" opacity=".9">
    <polygon points="30,0 0,80 25,80 10,140 60,60 32,60 50,0" fill="#fbbf24"/>
    <polygon points="32,2 2,78 27,78 12,134 56,62 34,62 52,2" fill="#fde68a" opacity=".6"/>
  </g>
  <!-- Brand -->
  <text x="600" y="380" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="56" font-weight="800" fill="#fff">Pysdn <tspan fill="url(#accent)">SuperCool</tspan></text>
  <!-- Tagline -->
  <text x="600" y="440" text-anchor="middle" font-family="Inter,Noto Sans TC,Arial,sans-serif" font-size="26" fill="#94a3b8">從一句想法到成片的一站式 AI 內容創作平台</text>
  <!-- Features -->
  <g transform="translate(600,510)" text-anchor="middle" font-family="Inter,Noto Sans TC,Arial,sans-serif" font-size="18" fill="#64748b">
    <text x="-200">🎬 影片生成</text>
    <text x="0">🎭 短劇製作</text>
    <text x="200">🖼️ 圖片工坊</text>
  </g>
  <!-- Bottom accent line -->
  <rect x="0" y="626" width="1200" height="4" fill="url(#accent)"/>
</svg>
